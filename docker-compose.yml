# BabyApp — everything in one compose project:
#   web      the PWA (built with the Supabase URL/key baked in)
#   supabase the local Supabase stack (included, pinned to tag v1.26.08)
#
# Usage:
#   make setup          first run: env, build, up, migrations
#   make up             day to day (syncs .env, then docker compose up -d --build)
#   make down           stop everything (data is kept)
#
# Note: compose interpolates ${VAR} from the ROOT .env only —
# scripts/sync-env.sh keeps the stack variables (generated into
# docker/supabase/.env) mirrored into it. Use the make targets so the
# sync always runs.
#
# Ports (override in .env): WEB_PORT (app, default 8088),
# KONG_HTTP_PORT (API gateway, default 8000), POSTGRES_PORT (5432),
# SEARXNG_PORT (Barry's web search, default 8888).

name: babyapp

include:
  - ./docker/supabase/docker-compose.yml

services:
  web:
    container_name: babyapp-web
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Baked into the browser bundle at build time. The anon key is a
        # public credential (safe to expose); it must match the one in
        # docker/supabase/.env — scripts/setup-docker.sh keeps them in sync.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://localhost:8000}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-8088}:80
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  searxng:
    # Metasearch that Barry's edge function queries for web grounding
    # (JSON API + limiter off, see docker/searxng/settings.yml). Reachable
    # from the edge runtime as http://searxng:8080 (shared network).
    container_name: babyapp-searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - ${SEARXNG_PORT:-8888}:8080
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/healthz\", timeout=5)'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
